<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consensus Research Paper Explorer</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#2563eb',
                            600: '#1d4ed8',
                            700: '#1e40af',
                            800: '#1e3a8a',
                            900: '#172554',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.4) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        .dark .shimmer {
            background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0) 100%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(156, 163, 175, 0.4); border-radius: 9999px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(156, 163, 175, 0.7); }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-900 dark:text-slate-100 min-h-screen flex flex-col antialiased selection:bg-brand-500 selection:text-white">

    <!-- Top Navigation -->
    <header class="sticky top-0 z-30 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md border-b border-slate-200/80 dark:border-slate-800 transition-colors">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Logo -->
            <div class="flex items-center space-x-3 cursor-pointer" onclick="resetToHome()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-600 via-indigo-600 to-sky-500 flex items-center justify-center text-white shadow-md shadow-brand-500/20">
                    <i class="fa-solid fa-atom text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-tight bg-gradient-to-r from-slate-900 to-brand-600 dark:from-white dark:to-brand-400 bg-clip-text text-transparent">
                        Consensus Explorer
                    </h1>
                    <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">Scientific Literature Dashboard</p>
                </div>
            </div>

            <!-- Controls -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <!-- Bookmarks Drawer Button -->
                <button id="bookmarks-btn" class="relative p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    <i class="fa-regular fa-bookmark text-lg"></i>
                    <span id="bookmark-badge" class="hidden absolute -top-1 -right-1 bg-brand-600 text-white text-[10px] font-extrabold w-5 h-5 rounded-full border-2 border-white dark:border-slate-900 flex items-center justify-center">0</span>
                </button>

                <!-- Theme Toggle -->
                <button id="theme-btn" class="p-2.5 rounded-xl text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all">
                    <i class="fa-solid fa-moon dark:hidden text-lg"></i>
                    <i class="fa-solid fa-sun hidden dark:block text-lg text-amber-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-grow max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">

        <!-- Search Bar Card -->
        <section class="bg-white dark:bg-slate-800 rounded-2xl p-5 shadow-sm border border-slate-200/80 dark:border-slate-700/80 transition-all space-y-4">
            <form id="search-form" class="space-y-4">
                <div class="relative flex items-center">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 text-slate-400 text-lg"></i>
                    <input type="text" id="query-input" placeholder="Search papers, materials, or medical questions (e.g., 'NaNiO2 Battery' or 'Sodium Ion Cathode')..."
                        class="w-full pl-11 pr-28 py-3.5 rounded-xl border border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 text-sm sm:text-base focus:ring-2 focus:ring-brand-500 focus:outline-none transition shadow-inner">
                    
                    <button type="button" id="clear-query-btn" class="hidden absolute right-28 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-2">
                        <i class="fa-solid fa-circle-xmark"></i>
                    </button>

                    <button type="submit" id="search-btn" class="absolute right-1.5 top-1.5 bottom-1.5 px-5 bg-brand-600 hover:bg-brand-700 text-white font-semibold text-sm rounded-lg shadow-md transition-all flex items-center space-x-2">
                        <span id="search-btn-text">Search</span>
                        <i id="search-btn-icon" class="fa-solid fa-arrow-right text-xs"></i>
                    </button>
                </div>

                <!-- Quick Query Suggestions Chips -->
                <div class="flex items-center space-x-2 overflow-x-auto pb-1 text-xs">
                    <span class="text-slate-400 font-medium whitespace-nowrap">Popular Queries:</span>
                    <button type="button" class="quick-chip px-3 py-1 rounded-full bg-brand-50 dark:bg-slate-700/50 text-brand-600 dark:text-brand-300 hover:bg-brand-100 dark:hover:bg-slate-700 transition whitespace-nowrap">NaNiO2 Battery</button>
                    <button type="button" class="quick-chip px-3 py-1 rounded-full bg-brand-50 dark:bg-slate-700/50 text-brand-600 dark:text-brand-300 hover:bg-brand-100 dark:hover:bg-slate-700 transition whitespace-nowrap">Sodium Ion Cathode</button>
                    <button type="button" class="quick-chip px-3 py-1 rounded-full bg-brand-50 dark:bg-slate-700/50 text-brand-600 dark:text-brand-300 hover:bg-brand-100 dark:hover:bg-slate-700 transition whitespace-nowrap">Layered Oxides</button>
                    <button type="button" class="quick-chip px-3 py-1 rounded-full bg-brand-50 dark:bg-slate-700/50 text-brand-600 dark:text-brand-300 hover:bg-brand-100 dark:hover:bg-slate-700 transition whitespace-nowrap">Solid State Electrolyte</button>
                </div>
            </form>

            <!-- Filters & Controls Bar -->
            <div class="pt-3 border-t border-slate-100 dark:border-slate-700/60 flex flex-wrap items-center justify-between gap-3 text-xs">
                <div class="flex flex-wrap items-center gap-3">
                    <!-- Results Page Size -->
                    <div class="flex items-center space-x-1.5">
                        <label class="text-slate-500 font-medium">Fetch Count:</label>
                        <select id="page-size-select" class="bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg px-2.5 py-1 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-brand-500">
                            <option value="10" selected>10 papers</option>
                            <option value="20">20 papers</option>
                            <option value="50">50 papers</option>
                        </select>
                    </div>

                    <!-- Filter: Min Citations -->
                    <div class="flex items-center space-x-1.5">
                        <label class="text-slate-500 font-medium">Min Citations:</label>
                        <select id="min-citations-select" class="bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg px-2.5 py-1 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-brand-500">
                            <option value="0" selected>Any</option>
                            <option value="10">10+</option>
                            <option value="50">50+</option>
                            <option value="100">100+</option>
                        </select>
                    </div>

                    <!-- Filter: Study Type -->
                    <div class="flex items-center space-x-1.5">
                        <label class="text-slate-500 font-medium">Study Type:</label>
                        <select id="study-type-select" class="bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg px-2.5 py-1 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-brand-500">
                            <option value="ALL" selected>All Types</option>
                            <option value="bench experiment">Bench Experiment</option>
                            <option value="review">Review Paper</option>
                            <option value="meta analysis">Meta Analysis</option>
                            <option value="clinical trial">Clinical Trial</option>
                        </select>
                    </div>
                </div>

                <!-- Sort By -->
                <div class="flex items-center space-x-1.5 ml-auto">
                    <label class="text-slate-500 font-medium">Sort By:</label>
                    <select id="sort-by-select" class="bg-slate-100 dark:bg-slate-700 border border-slate-200 dark:border-slate-600 rounded-lg px-2.5 py-1 text-slate-700 dark:text-slate-200 focus:outline-none focus:ring-1 focus:ring-brand-500">
                        <option value="relevance" selected>Relevance</option>
                        <option value="citations">Most Citations</option>
                        <option value="year">Newest First</option>
                    </select>
                </div>
            </div>

            <!-- Recent History Section -->
            <div id="history-container" class="hidden pt-2 text-xs">
                <div class="flex items-center justify-between mb-1.5">
                    <span class="text-slate-400 font-medium"><i class="fa-solid fa-history mr-1"></i> Recent Searches:</span>
                    <button id="clear-history-btn" class="text-slate-400 hover:text-rose-500">Clear</button>
                </div>
                <div id="history-chips-list" class="flex flex-wrap gap-1.5"></div>
            </div>
        </section>

        <!-- Notification Banner -->
        <div id="toast-banner" class="hidden p-4 rounded-xl border text-sm font-medium transition-all shadow-sm flex items-center justify-between">
            <div class="flex items-center space-x-2.5" id="toast-content"></div>
            <button onclick="hideToast()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>

        <!-- Bookmarks Section View -->
        <section id="bookmarks-view" class="hidden bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex items-center justify-between pb-3 border-b border-slate-200 dark:border-slate-700">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-bookmark text-brand-600 dark:text-brand-400 text-lg"></i>
                    <h2 class="text-lg font-bold">Saved Research Papers</h2>
                </div>
                <button onclick="closeBookmarksView()" class="text-xs text-brand-600 dark:text-brand-400 font-semibold hover:underline">
                    Back to Results
                </button>
            </div>
            <div id="bookmarks-list" class="space-y-4"></div>
        </section>

        <!-- Paper Search Results Section -->
        <section id="results-view" class="space-y-4">
            <!-- Results Metadata Bar -->
            <div id="results-meta" class="hidden flex items-center justify-between px-1 text-sm text-slate-500 dark:text-slate-400">
                <span>Showing <strong id="results-count-num" class="text-slate-900 dark:text-white font-bold">0</strong> papers</span>
                <span id="fetch-duration" class="text-xs bg-slate-200 dark:bg-slate-800 px-2.5 py-1 rounded-full font-mono"></span>
            </div>

            <!-- Shimmer Loading State -->
            <div id="shimmer-loader" class="hidden space-y-4">
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 space-y-3 relative overflow-hidden shimmer">
                    <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded-lg w-3/4"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded-lg w-1/2"></div>
                    <div class="h-16 bg-slate-100 dark:bg-slate-700/50 rounded-xl w-full"></div>
                </div>
                <div class="bg-white dark:bg-slate-800 rounded-2xl p-6 border border-slate-200 dark:border-slate-700 space-y-3 relative overflow-hidden shimmer">
                    <div class="h-6 bg-slate-200 dark:bg-slate-700 rounded-lg w-2/3"></div>
                    <div class="h-4 bg-slate-200 dark:bg-slate-700 rounded-lg w-1/3"></div>
                    <div class="h-16 bg-slate-100 dark:bg-slate-700/50 rounded-xl w-full"></div>
                </div>
            </div>

            <!-- Main Results List Cards -->
            <div id="papers-list" class="space-y-4">
                <!-- Initial Empty State -->
                <div id="empty-state" class="bg-white dark:bg-slate-800 rounded-2xl p-12 text-center border border-slate-200 dark:border-slate-700 shadow-sm space-y-4">
                    <div class="w-16 h-16 bg-brand-50 dark:bg-slate-700 text-brand-600 dark:text-brand-400 rounded-full flex items-center justify-center mx-auto text-2xl">
                        <i class="fa-solid fa-microscope"></i>
                    </div>
                    <div>
                        <h3 class="text-lg font-bold text-slate-900 dark:text-white">Ready for Exploration</h3>
                        <p class="text-slate-500 dark:text-slate-400 text-sm max-w-md mx-auto mt-1">
                            Type a question or topic above to query peer-reviewed scientific papers through your Consensus API serverless proxy.
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- Citation Modal -->
    <div id="citation-modal" class="hidden fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
        <div class="bg-white dark:bg-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 space-y-4">
            <div class="flex items-center justify-between">
                <h3 class="font-bold text-base flex items-center space-x-2">
                    <i class="fa-solid fa-quote-right text-brand-600"></i>
                    <span>Copy Citation</span>
                </h3>
                <button onclick="closeCitationModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            
            <div class="space-y-3 text-xs">
                <div>
                    <label class="block font-semibold text-slate-500 mb-1">APA Format</label>
                    <div class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 font-mono text-slate-800 dark:text-slate-200 select-all" id="apa-citation-text"></div>
                </div>
                <div>
                    <label class="block font-semibold text-slate-500 mb-1">BibTeX</label>
                    <pre class="p-3 bg-slate-50 dark:bg-slate-900 rounded-xl border border-slate-200 dark:border-slate-700 font-mono text-[11px] text-slate-800 dark:text-slate-200 overflow-x-auto select-all" id="bibtex-citation-text"></pre>
                </div>
            </div>

            <button onclick="copyCurrentCitation()" class="w-full py-2.5 bg-brand-600 hover:bg-brand-700 text-white font-medium text-xs rounded-xl shadow transition">
                <i class="fa-solid fa-copy mr-1"></i> Copy APA Citation to Clipboard
            </button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        const state = {
            rawResults: [],
            filteredResults: [],
            bookmarks: JSON.parse(localStorage.getItem('consensus_saved_papers') || '[]'),
            history: JSON.parse(localStorage.getItem('consensus_query_history') || '[]'),
            currentCitationText: ''
        };

        // DOM Elements
        const queryInput = document.getElementById('query-input');
        const clearQueryBtn = document.getElementById('clear-query-btn');
        const searchForm = document.getElementById('search-form');
        const searchBtn = document.getElementById('search-btn');
        const searchBtnText = document.getElementById('search-btn-text');
        const searchBtnIcon = document.getElementById('search-btn-icon');
        
        const pageSizeSelect = document.getElementById('page-size-select');
        const minCitationsSelect = document.getElementById('min-citations-select');
        const studyTypeSelect = document.getElementById('study-type-select');
        const sortBySelect = document.getElementById('sort-by-select');

        const shimmerLoader = document.getElementById('shimmer-loader');
        const emptyState = document.getElementById('empty-state');
        const papersList = document.getElementById('papers-list');
        const resultsMeta = document.getElementById('results-meta');
        const resultsCountNum = document.getElementById('results-count-num');
        const fetchDuration = document.getElementById('fetch-duration');

        const toastBanner = document.getElementById('toast-banner');
        const toastContent = document.getElementById('toast-content');

        const bookmarkBadge = document.getElementById('bookmark-badge');
        const bookmarksBtn = document.getElementById('bookmarks-btn');
        const bookmarksView = document.getElementById('bookmarks-view');
        const bookmarksList = document.getElementById('bookmarks-list');
        const resultsView = document.getElementById('results-view');

        const historyContainer = document.getElementById('history-container');
        const historyChipsList = document.getElementById('history-chips-list');
        const clearHistoryBtn = document.getElementById('clear-history-btn');

        // Setup Init
        init();

        function init() {
            // Dark Mode
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }

            document.getElementById('theme-btn').addEventListener('click', () => {
                const isDark = document.documentElement.classList.toggle('dark');
                localStorage.setItem('theme', isDark ? 'dark' : 'light');
            });

            updateBookmarkBadge();
            renderHistoryChips();
            attachEvents();
        }

        function attachEvents() {
            queryInput.addEventListener('input', (e) => {
                if (e.target.value.trim().length > 0) {
                    clearQueryBtn.classList.remove('hidden');
                } else {
                    clearQueryBtn.classList.add('hidden');
                }
            });

            clearQueryBtn.addEventListener('click', () => {
                queryInput.value = '';
                clearQueryBtn.classList.add('hidden');
                queryInput.focus();
            });

            document.querySelectorAll('.quick-chip').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    queryInput.value = e.target.innerText;
                    clearQueryBtn.classList.remove('hidden');
                    fetchPapers();
                });
            });

            searchForm.addEventListener('submit', (e) => {
                e.preventDefault();
                fetchPapers();
            });

            // Filters & Sorting triggers
            minCitationsSelect.addEventListener('change', applyFiltersAndRender);
            studyTypeSelect.addEventListener('change', applyFiltersAndRender);
            sortBySelect.addEventListener('change', applyFiltersAndRender);

            bookmarksBtn.addEventListener('click', () => {
                if (bookmarksView.classList.contains('hidden')) {
                    renderBookmarksView();
                    bookmarksView.classList.remove('hidden');
                    resultsView.classList.add('hidden');
                } else {
                    closeBookmarksView();
                }
            });

            clearHistoryBtn.addEventListener('click', () => {
                state.history = [];
                localStorage.removeItem('consensus_query_history');
                renderHistoryChips();
            });
        }

        function resetToHome() {
            closeBookmarksView();
            queryInput.value = '';
            clearQueryBtn.classList.add('hidden');
            papersList.innerHTML = '';
            emptyState.classList.remove('hidden');
            resultsMeta.classList.add('hidden');
        }

        function closeBookmarksView() {
            bookmarksView.classList.add('hidden');
            resultsView.classList.remove('hidden');
        }

        // Fetch Papers from Vercel Serverless Function Proxy (`/api/search`)
        async function fetchPapers() {
            const query = queryInput.value.trim();
            if (!query) {
                showToast('Please enter a query or topic', 'warning');
                return;
            }

            // Set UI Loading state
            closeBookmarksView();
            emptyState.classList.add('hidden');
            papersList.innerHTML = '';
            resultsMeta.classList.add('hidden');
            shimmerLoader.classList.remove('hidden');

            searchBtn.disabled = true;
            searchBtnText.innerText = 'Searching...';
            searchBtnIcon.className = 'fa-solid fa-spinner animate-spin text-xs';

            const startTime = performance.now();

            try {
                const pageSize = pageSizeSelect.value;
                // Calls relative endpoint provided by Vercel serverless /api/search.js
                const response = await fetch(`/api/search?query=${encodeURIComponent(query)}&page_size=${pageSize}`);

                if (!response.ok) {
                    const errorData = await response.json().catch(() => ({}));
                    throw new Error(errorData.error || `Server Error (${response.status})`);
                }

                const data = await response.json();
                const endTime = performance.now();
                const duration = ((endTime - startTime) / 1000).toFixed(2);

                // Handle nested structure returned by API
                let papers = data.results || data.papers || data.data || [];
                if (!Array.isArray(papers) && typeof data === 'object') {
                    papers = Object.values(data).find(val => Array.isArray(val)) || [];
                }

                state.rawResults = papers;
                fetchDuration.innerText = `${duration}s response`;

                saveQueryToHistory(query);
                applyFiltersAndRender();

            } catch (err) {
                shimmerLoader.classList.add('hidden');
                emptyState.classList.remove('hidden');
                showToast(err.message || 'Failed to fetch search results from server proxy', 'danger');
            } finally {
                searchBtn.disabled = false;
                searchBtnText.innerText = 'Search';
                searchBtnIcon.className = 'fa-solid fa-arrow-right text-xs';
            }
        }

        // Apply Client-Side Filters & Sorting
        function applyFiltersAndRender() {
            shimmerLoader.classList.add('hidden');

            let filtered = [...state.rawResults];

            // Filter: Minimum Citations
            const minCites = parseInt(minCitationsSelect.value, 10);
            if (minCites > 0) {
                filtered = filtered.filter(p => (p.citation_count || p.citations || 0) >= minCites);
            }

            // Filter: Study Type
            const selectedType = studyTypeSelect.value;
            if (selectedType !== 'ALL') {
                filtered = filtered.filter(p => {
                    const st = (p.study_type || p.study_design || '').toLowerCase();
                    return st.includes(selectedType);
                });
            }

            // Sort
            const sortBy = sortBySelect.value;
            if (sortBy === 'citations') {
                filtered.sort((a, b) => (b.citation_count || b.citations || 0) - (a.citation_count || a.citations || 0));
            } else if (sortBy === 'year') {
                filtered.sort((a, b) => (b.publish_year || b.year || 0) - (a.publish_year || a.year || 0));
            }

            state.filteredResults = filtered;
            renderPapersList(filtered);
        }

        // Render Cards
        function renderPapersList(papers) {
            resultsCountNum.innerText = papers.length;
            resultsMeta.classList.remove('hidden');

            if (papers.length === 0) {
                papersList.innerHTML = `
                    <div class="bg-white dark:bg-slate-800 rounded-2xl p-8 text-center border border-slate-200 dark:border-slate-700">
                        <i class="fa-solid fa-filter-circle-xmark text-3xl text-slate-400 mb-2"></i>
                        <h4 class="font-bold text-slate-700 dark:text-slate-300">No papers match current filters</h4>
                        <p class="text-xs text-slate-500 mt-1">Try relaxing minimum citations or study type filter.</p>
                    </div>
                `;
                return;
            }

            papersList.innerHTML = papers.map((paper, idx) => createPaperCardHtml(paper, idx)).join('');
        }

        function createPaperCardHtml(paper, idx) {
            const title = paper.title || paper.paper_title || 'Untitled Research Paper';
            const year = paper.publish_year || paper.year || 'N/A';
            const journal = paper.journal_name || paper.journal || paper.venue || 'Academic Journal';
            
            // Format Authors List
            let authorsStr = 'Unknown Authors';
            if (Array.isArray(paper.authors)) {
                if (paper.authors.length > 3) {
                    authorsStr = `${paper.authors.slice(0, 3).map(formatAuthorName).join(', ')} et al.`;
                } else {
                    authorsStr = paper.authors.map(formatAuthorName).join(', ');
                }
            } else if (typeof paper.authors === 'string') {
                authorsStr = paper.authors;
            }

            const citations = paper.citation_count || paper.citations || 0;
            const influentialCitations = paper.influential_citation_count || 0;
            const doiUrl = paper.doi ? (paper.doi.startsWith('http') ? paper.doi : `https://doi.org/${paper.doi}`) : (paper.url || '#');
            
            const takeaway = paper.takeaway || paper.consensus_takeaway || null;
            const abstract = paper.abstract || paper.snippet || 'No abstract preview available for this publication.';
            const studyType = paper.study_type || paper.study_design || null;
            const sjrQuartile = paper.sjr_best_quartile || null;

            const isBookmarked = state.bookmarks.some(b => (b.title || b.paper_title) === title);

            return `
                <article class="bg-white dark:bg-slate-800 rounded-2xl p-6 shadow-sm border border-slate-200/90 dark:border-slate-700 hover:border-brand-400 dark:hover:border-brand-500 transition-all duration-200 space-y-4">
                    <!-- Title & Header -->
                    <div class="flex items-start justify-between gap-4">
                        <h3 class="text-base sm:text-lg font-bold text-slate-900 dark:text-white leading-snug">
                            <a href="${doiUrl}" target="_blank" rel="noopener" class="hover:text-brand-600 dark:hover:text-brand-400 transition-colors">
                                ${escapeHtml(title)}
                            </a>
                        </h3>
                        <button onclick="toggleBookmark(${idx})" class="text-slate-400 hover:text-amber-500 transition p-1" title="${isBookmarked ? 'Remove Bookmark' : 'Bookmark Paper'}">
                            <i class="${isBookmarked ? 'fa-solid text-amber-500' : 'fa-regular'} fa-bookmark text-lg"></i>
                        </button>
                    </div>

                    <!-- Author & Publication Metadata -->
                    <div class="text-xs text-slate-500 dark:text-slate-400 space-y-1.5">
                        <p class="font-medium text-slate-700 dark:text-slate-300">
                            <i class="fa-regular fa-user mr-1.5 text-slate-400"></i>${escapeHtml(authorsStr)}
                        </p>
                        <div class="flex flex-wrap items-center gap-2 pt-0.5">
                            <span class="font-bold text-slate-800 dark:text-slate-200 bg-slate-100 dark:bg-slate-700 px-2 py-0.5 rounded-md">${escapeHtml(journal)}</span>
                            <span>•</span>
                            <span class="font-medium">${year}</span>
                            
                            ${sjrQuartile ? `
                                <span>•</span>
                                <span class="px-2 py-0.5 rounded-md bg-purple-50 dark:bg-purple-950/60 text-purple-700 dark:text-purple-300 font-bold border border-purple-200 dark:border-purple-800">
                                    Q${sjrQuartile} SJR
                                </span>
                            ` : ''}

                            ${studyType ? `
                                <span>•</span>
                                <span class="capitalize px-2 py-0.5 rounded-md bg-indigo-50 dark:bg-indigo-950/60 text-indigo-700 dark:text-indigo-300 font-medium border border-indigo-200 dark:border-indigo-800">
                                    <i class="fa-solid fa-flask text-[10px] mr-1"></i>${escapeHtml(studyType)}
                                </span>
                            ` : ''}
                        </div>
                    </div>

                    <!-- Key Takeaway Box -->
                    ${takeaway ? `
                        <div class="p-4 bg-gradient-to-r from-brand-50 to-indigo-50/50 dark:from-slate-900 dark:to-slate-900/80 rounded-xl border border-brand-200/80 dark:border-brand-900/60 text-xs space-y-1">
                            <div class="flex items-center text-brand-700 dark:text-brand-400 font-bold space-x-1.5 mb-1">
                                <i class="fa-solid fa-bolt text-amber-500"></i>
                                <span>Consensus Key Takeaway</span>
                            </div>
                            <p class="text-slate-800 dark:text-slate-200 font-medium leading-relaxed">${escapeHtml(takeaway)}</p>
                        </div>
                    ` : ''}

                    <!-- Expandable Abstract Accordion -->
                    <div class="text-xs">
                        <button onclick="toggleAbstract(${idx})" class="flex items-center space-x-1 text-slate-500 dark:text-slate-400 hover:text-brand-600 dark:hover:text-brand-400 font-semibold focus:outline-none">
                            <span id="abstract-btn-text-${idx}">Show Abstract</span>
                            <i id="abstract-btn-icon-${idx}" class="fa-solid fa-chevron-down text-[10px] transition-transform"></i>
                        </button>
                        <div id="abstract-content-${idx}" class="hidden mt-2 p-3.5 bg-slate-50 dark:bg-slate-900/60 rounded-xl border border-slate-200/60 dark:border-slate-700/60 text-slate-700 dark:text-slate-300 leading-relaxed">
                            ${escapeHtml(abstract)}
                        </div>
                    </div>

                    <!-- Metrics & Action Footer -->
                    <div class="flex flex-wrap items-center justify-between gap-3 pt-3 border-t border-slate-100 dark:border-slate-700/60 text-xs">
                        <!-- Citations -->
                        <div class="flex items-center space-x-3">
                            <span class="inline-flex items-center text-slate-700 dark:text-slate-300 font-bold bg-slate-100 dark:bg-slate-700 px-2.5 py-1 rounded-lg">
                                <i class="fa-solid fa-quote-right text-brand-600 mr-1.5 text-[10px]"></i>${citations} citations
                            </span>

                            ${influentialCitations > 0 ? `
                                <span class="inline-flex items-center text-amber-700 dark:text-amber-300 font-bold bg-amber-50 dark:bg-amber-950/50 px-2.5 py-1 rounded-lg border border-amber-200 dark:border-amber-900">
                                    <i class="fa-solid fa-fire mr-1 text-[10px]"></i>${influentialCitations} influential
                                </span>
                            ` : ''}
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center space-x-2 ml-auto">
                            <button onclick="openCitationModal(${idx})" class="px-3 py-1.5 rounded-lg bg-slate-100 dark:bg-slate-700 hover:bg-slate-200 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-medium transition flex items-center space-x-1">
                                <i class="fa-regular fa-copy"></i>
                                <span>Cite</span>
                            </button>
                            
                            <a href="${doiUrl}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-lg bg-brand-600 hover:bg-brand-700 text-white font-medium transition flex items-center space-x-1">
                                <span>DOI / View</span>
                                <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                            </a>
                        </div>
                    </div>
                </article>
            `;
        }

        // Abstract Accordion Toggle
        window.toggleAbstract = function(idx) {
            const content = document.getElementById(`abstract-content-${idx}`);
            const btnText = document.getElementById(`abstract-btn-text-${idx}`);
            const btnIcon = document.getElementById(`abstract-btn-icon-${idx}`);

            if (content.classList.contains('hidden')) {
                content.classList.remove('hidden');
                btnText.innerText = 'Hide Abstract';
                btnIcon.classList.add('rotate-180');
            } else {
                content.classList.add('hidden');
                btnText.innerText = 'Show Abstract';
                btnIcon.classList.remove('rotate-180');
            }
        };

        // Bookmarks Management
        window.toggleBookmark = function(idx) {
            const paper = state.filteredResults[idx];
            const title = paper.title || paper.paper_title;
            const existingIndex = state.bookmarks.findIndex(b => (b.title || b.paper_title) === title);

            if (existingIndex > -1) {
                state.bookmarks.splice(existingIndex, 1);
                showToast('Removed paper from saved list', 'info');
            } else {
                state.bookmarks.push(paper);
                showToast('Paper bookmarked locally!', 'success');
            }

            localStorage.setItem('consensus_saved_papers', JSON.stringify(state.bookmarks));
            updateBookmarkBadge();
            
            if (!resultsView.classList.contains('hidden')) {
                renderPapersList(state.filteredResults);
            } else {
                renderBookmarksView();
            }
        };

        function updateBookmarkBadge() {
            const count = state.bookmarks.length;
            if (count > 0) {
                bookmarkBadge.innerText = count;
                bookmarkBadge.classList.remove('hidden');
            } else {
                bookmarkBadge.classList.add('hidden');
            }
        }

        function renderBookmarksView() {
            if (state.bookmarks.length === 0) {
                bookmarksList.innerHTML = `
                    <div class="text-center py-12 text-slate-400 space-y-2">
                        <i class="fa-regular fa-bookmark text-3xl"></i>
                        <p class="text-sm">No saved papers found.</p>
                    </div>
                `;
                return;
            }

            bookmarksList.innerHTML = state.bookmarks.map((paper, index) => `
                <div class="p-4 rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-700 flex items-center justify-between gap-4">
                    <div class="space-y-1">
                        <h4 class="font-bold text-sm text-slate-800 dark:text-slate-100">
                            <a href="${paper.doi ? `https://doi.org/${paper.doi}` : '#'}" target="_blank" class="hover:underline">${escapeHtml(paper.title || 'Untitled')}</a>
                        </h4>
                        <p class="text-xs text-slate-500">${escapeHtml(paper.journal_name || 'Journal')} • ${paper.publish_year || 'N/A'}</p>
                    </div>
                    <button onclick="removeBookmark(${index})" class="text-rose-500 hover:text-rose-700 p-2 text-sm" title="Remove">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            `).join('');
        }

        window.removeBookmark = function(index) {
            state.bookmarks.splice(index, 1);
            localStorage.setItem('consensus_saved_papers', JSON.stringify(state.bookmarks));
            updateBookmarkBadge();
            renderBookmarksView();
        };

        // Citation Modal
        window.openCitationModal = function(idx) {
            const paper = state.filteredResults[idx];
            const title = paper.title || 'Untitled Paper';
            const year = paper.publish_year || 'n.d.';
            const journal = paper.journal_name || 'Journal';
            const authors = Array.isArray(paper.authors) ? paper.authors.join(', ') : (paper.authors || 'Author');
            const doi = paper.doi ? `https://doi.org/${paper.doi}` : '';

            const apa = `${authors} (${year}). ${title}. ${journal}. ${doi}`;
            const bibtex = `@article{paper${idx},\n  author = {${authors}},\n  title = {${title}},\n  journal = {${journal}},\n  year = {${year}}\n}`;

            document.getElementById('apa-citation-text').innerText = apa;
            document.getElementById('bibtex-citation-text').innerText = bibtex;
            state.currentCitationText = apa;

            document.getElementById('citation-modal').classList.remove('hidden');
        };

        window.closeCitationModal = function() {
            document.getElementById('citation-modal').classList.add('hidden');
        };

        window.copyCurrentCitation = function() {
            navigator.clipboard.writeText(state.currentCitationText).then(() => {
                showToast('Citation copied to clipboard!', 'success');
                closeCitationModal();
            });
        };

        // Query Search History
        function saveQueryToHistory(q) {
            if (!state.history.includes(q)) {
                state.history.unshift(q);
                if (state.history.length > 6) state.history.pop();
                localStorage.setItem('consensus_query_history', JSON.stringify(state.history));
                renderHistoryChips();
            }
        }

        function renderHistoryChips() {
            if (state.history.length === 0) {
                historyContainer.classList.add('hidden');
                return;
            }
            historyContainer.classList.remove('hidden');
            historyChipsList.innerHTML = state.history.map(item => `
                <button onclick="searchFromHistory('${escapeHtml(item)}')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-300 font-medium transition flex items-center space-x-1">
                    <i class="fa-solid fa-clock-rotate-left text-[10px] text-slate-400"></i>
                    <span>${escapeHtml(item)}</span>
                </button>
            `).join('');
        }

        window.searchFromHistory = function(q) {
            queryInput.value = q;
            clearQueryBtn.classList.remove('hidden');
            fetchPapers();
        };

        // Toast Helper
        function showToast(message, type = 'info') {
            const bgClasses = {
                success: 'bg-emerald-50 text-emerald-800 border-emerald-200 dark:bg-emerald-950/80 dark:border-emerald-800 dark:text-emerald-300',
                danger: 'bg-rose-50 text-rose-800 border-rose-200 dark:bg-rose-950/80 dark:border-rose-800 dark:text-rose-300',
                warning: 'bg-amber-50 text-amber-800 border-amber-200 dark:bg-amber-950/80 dark:border-amber-800 dark:text-amber-300',
                info: 'bg-blue-50 text-blue-800 border-blue-200 dark:bg-blue-950/80 dark:border-blue-800 dark:text-blue-300'
            };
            const icons = {
                success: 'fa-circle-check text-emerald-600',
                danger: 'fa-circle-exclamation text-rose-600',
                warning: 'fa-triangle-exclamation text-amber-600',
                info: 'fa-circle-info text-blue-600'
            };

            toastBanner.className = `p-4 rounded-xl border text-sm font-medium transition-all shadow-sm flex items-center justify-between ${bgClasses[type]}`;
            toastContent.innerHTML = `<i class="fa-solid ${icons[type]} text-lg"></i><span>${escapeHtml(message)}</span>`;
            toastBanner.classList.remove('hidden');

            setTimeout(hideToast, 4000);
        }

        window.hideToast = function() {
            toastBanner.classList.add('hidden');
        };

        // Helper functions
        function formatAuthorName(author) {
            if (typeof author === 'object') return author.name || author.author_name || 'Author';
            return author;
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
